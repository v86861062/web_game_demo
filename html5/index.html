<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Starbound Orders HTML5 Preview</title>
    <link rel="stylesheet" href="./styles.css?v=html5-copy-20260603" />
  </head>
  <body>
    <main id="app">
      <canvas id="star-map" aria-label="Starbound Orders HTML5 star map"></canvas>
      <section id="hud" aria-label="狀態">
        <div class="hud-title">Starbound Orders <span>HTML5 預覽</span></div>
        <div class="hud-row"><strong>資金：</strong><span id="credits">--</span></div>
        <div class="hud-row"><strong>資源：</strong><span id="resource-summary">--</span></div>
        <div class="hud-row"><strong>時間：</strong><span id="time-summary">--</span></div>
        <div class="hud-row event-row"><strong>事件：</strong><span id="latest-event">--</span></div>
        <div id="command-status">啟動中...</div>
      </section>
      <section id="mobile-sheet" class="idle-operations-deck" data-active-tab="command" data-collapsed="false" aria-label="艦隊營運面板">
        <div id="mobile-sheet-grip">
          <button id="mobile-sheet-toggle" type="button" aria-expanded="true">收合</button>
        </div>
        <div id="mobile-sheet-tabs" role="tablist" aria-label="艦隊營運面板">
          <button type="button" data-sheet-tab="command" aria-selected="true">指揮</button>
          <button type="button" data-sheet-tab="fleet" aria-selected="false">艦隊</button>
          <button type="button" data-sheet-tab="market" aria-selected="false">市場</button>
          <button type="button" data-sheet-tab="tools" aria-selected="false">工具</button>
        </div>
        <section id="command-panel" class="drawer-panel idle-command-panel" data-sheet-panel="command" aria-label="艦隊指揮">
          <h2>營運首頁</h2>
          <div id="fleet-command-center" class="fleet-command-center" aria-label="艦隊指揮中心"></div>
          <div id="fleet-summary" class="fleet-summary"></div>
          <div id="fleet-alerts" class="fleet-alerts"></div>
        </section>
        <section id="fleet-panel" class="drawer-panel" data-sheet-panel="fleet" aria-label="艦隊詳情"><h2>艦隊詳情：</h2><div id="ship-list"></div></section>
        <section id="market-panel" class="drawer-panel" data-sheet-panel="market" data-market-tab="overview" aria-label="市場">
          <h2>市場 / 合約 / 升級：<span class="text-content-separator">｜</span></h2><div id="market-tabs" role="tablist" aria-label="市場面板">
            <button type="button" data-market-tab="overview" aria-selected="true">總覽</button>
            <button type="button" data-market-tab="trade" aria-selected="false">交易</button>
            <button type="button" data-market-tab="orders" aria-selected="false">訂單</button>
            <button type="button" data-market-tab="production" aria-selected="false">生產</button>
            <button type="button" data-market-tab="risk" aria-selected="false">風險</button>
            <button type="button" data-market-tab="upgrades" aria-selected="false">升級</button>
            <button type="button" data-market-tab="reports" aria-selected="false">報告</button>
            <button type="button" data-market-tab="stations" aria-selected="false">站點</button>
          </div>
          <div id="market-list"></div>
        </section>
        <section id="tools-panel" class="drawer-panel" data-sheet-panel="tools" aria-label="工具"><h2>工具 / 回放：<span class="text-content-separator">｜</span></h2><section id="chronocam-panel" class="tool-card" aria-label="ChronoCam"><h3>ChronoCam 狀態：</h3><div class="chrono-row"><strong>模式：</strong><span id="chronocam-mode">--</span></div><span class="text-content-separator">｜</span><div class="chrono-row"><strong>觀看時間：</strong><span id="chronocam-view-time">--</span></div><span class="text-content-separator">｜</span><div class="chrono-row"><strong>跟隨狀態：</strong><span id="chronocam-follow">--</span></div><span class="text-content-separator">｜</span><div class="chrono-actions"><button type="button" data-command="chrono_rewind_5">回看 5s</button><span class="text-content-separator">｜</span><button type="button" data-command="chrono_live">回到即時</button></div><span class="text-content-separator">
｜
</span></section><section id="mission-panel" class="tool-card" aria-label="任務"><h3>任務清單：</h3><div id="mission-list"></div></section></section>
      </section>
      <nav id="controls" aria-label="控制">
        <button data-command="toggle_pause">暫停</button>
        <button data-command="speed_1">1x</button>
        <button data-command="speed_3">3x</button>
        <details id="debug-controls" class="debug-controls">
          <summary aria-label="開啟工具選單">工具</summary>
          <div class="debug-menu" role="menu" aria-label="Debug 工具">
            <button data-command="select_scout" type="button">選 Scout</button>
            <button data-command="enter_north_gate" type="button">進入北門</button>
            <button data-command="reset" type="button">重置</button>
          </div>
        </details>
      </nav>
    </main>
    <script type="module" src="./bootstrap.js?v=html5-copy-20260603"></script>
  </body>
</html>
